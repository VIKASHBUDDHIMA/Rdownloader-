<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro YT Downloader</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 40px;
            border-radius: 20px;
            width: 100%;
            max-width: 600px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.3);
            text-align: center;
            animation: fadeIn 0.8s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1 {
            font-weight: 600;
            margin-bottom: 10px;
            color: #00e5ff;
        }

        p {
            font-weight: 300;
            font-size: 14px;
            margin-bottom: 30px;
            color: #ccc;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        input[type="text"] {
            width: 100%;
            padding: 15px;
            border-radius: 10px;
            border: none;
            outline: none;
            font-size: 16px;
            background: rgba(255,255,255,0.9);
            color: #333;
            transition: 0.3s;
        }

        input[type="text"]:focus {
            box-shadow: 0 0 15px #00e5ff;
        }

        .btn-main {
            padding: 15px;
            background: linear-gradient(135deg, #00e5ff, #0072ff);
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-main:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0, 229, 255, 0.4);
        }

        /* Progress Bar */
        .progress-wrapper {
            display: none;
            margin-top: 25px;
        }

        .progress-text {
            font-size: 13px;
            color: #00e5ff;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .progress-container {
            width: 100%;
            height: 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #00e5ff, #0072ff);
            border-radius: 10px;
            transition: width 0.4s ease;
        }

        /* Video Info & Download Section */
        .result-card {
            display: none;
            margin-top: 30px;
            background: rgba(0, 0, 0, 0.3);
            padding: 20px;
            border-radius: 15px;
            border: 1px solid rgba(255,255,255,0.1);
            animation: fadeIn 0.5s ease-in-out;
            text-align: left;
        }

        .video-header {
            display: flex;
            gap: 15px;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 15px;
        }

        .video-thumb {
            width: 120px;
            border-radius: 10px;
            object-fit: cover;
        }

        .video-title {
            font-size: 14px;
            font-weight: 600;
            color: #fff;
            line-height: 1.4;
        }

        .download-btn {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            padding: 14px 18px;
            margin-bottom: 12px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            color: #fff;
            text-decoration: none;
            transition: 0.2s;
        }

        .btn-audio { background: linear-gradient(135deg, #ff416c, #ff4b2b); }
        .btn-audio:hover { opacity: 0.9; transform: translateY(-1px); }

        .btn-720p { background: linear-gradient(135deg, #11998e, #38ef7d); }
        .btn-720p:hover { opacity: 0.9; transform: translateY(-1px); }

        .btn-360p { background: linear-gradient(135deg, #2193b0, #6dd5ed); }
        .btn-360p:hover { opacity: 0.9; transform: translateY(-1px); }

        .tag {
            background: rgba(255, 255, 255, 0.2);
            padding: 3px 8px;
            border-radius: 5px;
            font-size: 11px;
            font-weight: 400;
        }

        .footer {
            margin-top: 30px;
            font-size: 12px;
            color: #888;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Pro YT Downloader</h1>
        <p>Fast, Ad-Free Direct YouTube Downloader (MP4 & MP3).</p>
        
        <div class="input-group">
            <input type="text" id="videoUrl" placeholder="Paste YouTube Link here...">
            <button class="btn-main" onclick="fetchVideoData()">Get Download Links</button>
        </div>

        <!-- Animated Progress Bar -->
        <div class="progress-wrapper" id="progressWrapper">
            <div class="progress-text" id="progressText">Connecting to engine...</div>
            <div class="progress-container">
                <div class="progress-bar" id="progressBar"></div>
            </div>
        </div>

        <!-- Video Result & Direct Download Buttons -->
        <div class="result-card" id="resultCard">
            <div class="video-header">
                <img id="videoThumb" src="" alt="Thumbnail" class="video-thumb">
                <div id="videoTitle" class="video-title"></div>
            </div>

            <div id="downloadButtonsList">
                <!-- Direct Links Inserted Here -->
            </div>
        </div>

        <div class="footer">
            Powered by Cloudflare Pages & GitHub
        </div>
    </div>

    <script>
        // Multiple fallback API instances for 100% uptime
        const PIPED_INSTANCES = [
            'https://pipedapi.kavin.rocks',
            'https://api.piped.yt',
            'https://piped-api.garudalinux.org',
            'https://pipedapi.mha.fi'
        ];

        function getVideoId(url) {
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|&v=)([^#&?]*).*/;
            const match = url.match(regExp);
            return (match && match[2].length === 11) ? match[2] : null;
        }

        async function fetchVideoData() {
            const url = document.getElementById('videoUrl').value.trim();
            const videoId = getVideoId(url);

            if (!videoId) {
                alert("Please enter a valid YouTube URL!");
                return;
            }

            const progressWrapper = document.getElementById('progressWrapper');
            const progressBar = document.getElementById('progressBar');
            const progressText = document.getElementById('progressText');
            const resultCard = document.getElementById('resultCard');

            resultCard.style.display = 'none';
            progressWrapper.style.display = 'block';
            progressBar.style.width = '20%';
            progressText.innerText = "Extracting video streams...";

            let videoData = null;

            // Try fetching from public instances
            for (let i = 0; i < PIPED_INSTANCES.length; i++) {
                try {
                    progressBar.style.width = `${40 + (i * 15)}%`;
                    progressText.innerText = `Fetching streams (Server ${i + 1})...`;
                    
                    const response = await fetch(`${PIPED_INSTANCES[i]}/streams/${videoId}`);
                    if (response.ok) {
                        videoData = await response.json();
                        break;
                    }
                } catch (err) {
                    console.log(`Server ${i + 1} unreachable, switching to fallback...`);
                }
            }

            if (!videoData) {
                progressWrapper.style.display = 'none';
                alert("Unable to fetch video right now. Please try again in a few seconds.");
                return;
            }

            progressBar.style.width = '100%';
            progressText.innerText = "Ready!";

            // Render Thumbnail and Title
            document.getElementById('videoThumb').src = videoData.thumbnailUrl || `https://i.ytimg.com/vi/${videoId}/hqdefault.jpg`;
            document.getElementById('videoTitle').innerText = videoData.title || "YouTube Video";

            const btnContainer = document.getElementById('downloadButtonsList');
            btnContainer.innerHTML = '';

            // 1. Audio Stream (Direct MP3/Audio Link)
            if (videoData.audioStreams && videoData.audioStreams.length > 0) {
                const bestAudio = videoData.audioStreams[0];
                btnContainer.innerHTML += `
                    <a href="${bestAudio.url}" target="_blank" download class="download-btn btn-audio">
                        <span>🎵 Download Audio (MP3/M4A)</span>
                        <span class="tag">Direct File</span>
                    </a>
                `;
            }

            // 2. Video Streams (Direct MP4 Links)
            if (videoData.videoStreams) {
                // Find 720p HD with Audio
                const hdVideo = videoData.videoStreams.find(v => v.quality === '720p' && v.hasAudio) || 
                                videoData.videoStreams.find(v => v.hasAudio);
                
                if (hdVideo) {
                    btnContainer.innerHTML += `
                        <a href="${hdVideo.url}" target="_blank" download class="download-btn btn-720p">
                            <span>🎬 Download Video (${hdVideo.quality || 'HD'})</span>
                            <span class="tag">Direct MP4</span>
                        </a>
                    `;
                }

                // Find 360p or SD Video with Audio
                const sdVideo = videoData.videoStreams.find(v => v.quality === '360p' && v.hasAudio);
                if (sdVideo && sdVideo !== hdVideo) {
                    btnContainer.innerHTML += `
                        <a href="${sdVideo.url}" target="_blank" download class="download-btn btn-360p">
                            <span>🎬 Download Video (360p SD)</span>
                            <span class="tag">Fast Direct</span>
                        </a>
                    `;
                }
            }

            setTimeout(() => {
                progressWrapper.style.display = 'none';
                resultCard.style.display = 'block';
            }, 400);
        }
    </script>

</body>
</html>
