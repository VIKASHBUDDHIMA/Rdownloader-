<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro YT Downloader</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 40px;
            border-radius: 20px;
            width: 100%;
            max-width: 600px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            text-align: center;
            animation: fadeIn 1s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1 {
            font-weight: 600;
            margin-bottom: 10px;
            color: #00e5ff;
        }

        p {
            font-weight: 300;
            font-size: 14px;
            margin-bottom: 30px;
            color: #ccc;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        input[type="text"] {
            width: 100%;
            padding: 15px;
            border-radius: 10px;
            border: none;
            outline: none;
            font-size: 16px;
            background: rgba(255,255,255,0.9);
            color: #333;
            transition: 0.3s;
        }

        input[type="text"]:focus {
            box-shadow: 0 0 15px #00e5ff;
        }

        button {
            padding: 15px;
            background: linear-gradient(135deg, #00e5ff, #0072ff);
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0, 229, 255, 0.4);
        }

        /* Loading Animation */
        .loader-container {
            display: none;
            margin-top: 30px;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255,255,255,0.3);
            border-top: 4px solid #00e5ff;
            border-radius: 50%;
            margin: 0 auto 15px auto;
            animation: spin 1s linear infinite;
        }

        .loading-text {
            font-size: 14px;
            color: #00e5ff;
            animation: pulse 1.5s infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        /* Results Area */
        .result-area {
            display: none;
            margin-top: 30px;
            text-align: left;
            background: rgba(0, 0, 0, 0.3);
            padding: 20px;
            border-radius: 15px;
            animation: fadeIn 0.5s ease-in-out;
        }

        .result-area h3 {
            font-size: 16px;
            margin-bottom: 10px;
            color: #fff;
            border-bottom: 1px solid rgba(255,255,255,0.2);
            padding-bottom: 5px;
        }

        .iframe-container {
            width: 100%;
            height: 60px;
            overflow: hidden;
            border-radius: 10px;
            margin-bottom: 20px;
            background: #fff;
        }

        .footer {
            margin-top: 30px;
            font-size: 12px;
            color: #888;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Pro YT Downloader</h1>
        <p>YouTube වීඩියෝ පහසුවෙන් MP3 සහ MP4 (Quality) ලෙස Download කරගන්න.</p>
        
        <div class="input-group">
            <input type="text" id="videoUrl" placeholder="YouTube Link එක මෙතන Paste කරන්න...">
            <button onclick="fetchDownloadLinks()">Download Now</button>
        </div>

        <div class="loader-container" id="loader">
            <div class="spinner"></div>
            <div class="loading-text">Link එක සකස් කරමින් පවතී. කරුණාකර රැඳී සිටින්න...</div>
        </div>

        <div class="result-area" id="resultArea">
            <!-- Download Buttons will appear here -->
        </div>

        <div class="footer">
            Powered by Cloudflare Pages & GitHub
        </div>
    </div>

    <script>
        function fetchDownloadLinks() {
            const url = document.getElementById('videoUrl').value.trim();
            const loader = document.getElementById('loader');
            const resultArea = document.getElementById('resultArea');

            // Link Validation
            if (!url.includes('youtube.com') && !url.includes('youtu.be')) {
                alert("කරුණාකර නිවැරදි YouTube Link එකක් ලබාදෙන්න!");
                return;
            }

            // Hide previous results and show loader
            resultArea.style.display = 'none';
            resultArea.innerHTML = '';
            loader.style.display = 'block';

            // Loading Effect (Simulated for smooth UI)
            setTimeout(() => {
                loader.style.display = 'none';
                
                const encodedUrl = encodeURIComponent(url);

                // API Iframe URLs for different formats
                const mp3Url = `https://loader.to/api/button/?url=${encodedUrl}&f=mp3`;
                const video720Url = `https://loader.to/api/button/?url=${encodedUrl}&f=720`;
                const video1080Url = `https://loader.to/api/button/?url=${encodedUrl}&f=1080`;

                resultArea.innerHTML = `
                    <h3>🎵 MP3 (Audio) Download</h3>
                    <div class="iframe-container">
                        <iframe src="${mp3Url}" scrolling="no" style="width:100%; height:100%; border:none;"></iframe>
                    </div>

                    <h3>🎬 MP4 (720p HD) Video</h3>
                    <div class="iframe-container">
                        <iframe src="${video720Url}" scrolling="no" style="width:100%; height:100%; border:none;"></iframe>
                    </div>

                    <h3>🎬 MP4 (1080p FHD) Video</h3>
                    <div class="iframe-container">
                        <iframe src="${video1080Url}" scrolling="no" style="width:100%; height:100%; border:none;"></iframe>
                    </div>
                `;

                resultArea.style.display = 'block';

            }, 1500); // 1.5 seconds loading animation
        }
    </script>

</body>
</html>
