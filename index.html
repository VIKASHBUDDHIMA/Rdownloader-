<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro YT Downloader</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 40px;
            border-radius: 20px;
            width: 100%;
            max-width: 600px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.3);
            text-align: center;
        }

        h1 {
            font-weight: 600;
            margin-bottom: 10px;
            color: #00e5ff;
        }

        p {
            font-weight: 300;
            font-size: 14px;
            margin-bottom: 30px;
            color: #ccc;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        input[type="text"] {
            width: 100%;
            padding: 15px;
            border-radius: 10px;
            border: none;
            outline: none;
            font-size: 16px;
            background: rgba(255,255,255,0.9);
            color: #333;
            transition: 0.3s;
        }

        input[type="text"]:focus {
            box-shadow: 0 0 15px #00e5ff;
        }

        .btn-main {
            padding: 15px;
            background: linear-gradient(135deg, #00e5ff, #0072ff);
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-main:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0, 229, 255, 0.4);
        }

        /* Download Options Area */
        .download-options {
            display: none;
            margin-top: 30px;
            background: rgba(0, 0, 0, 0.3);
            padding: 25px;
            border-radius: 15px;
            border: 1px solid rgba(255,255,255,0.1);
            animation: fadeIn 0.5s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .download-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 12px;
            margin-bottom: 12px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            color: #fff;
            transition: 0.2s;
        }

        .btn-mp3 { background: #ff4757; }
        .btn-mp3:hover { background: #ff6b81; }

        .btn-mp4 { background: #2ed573; }
        .btn-mp4:hover { background: #7bed9f; }

        .btn-mp4-hd { background: #1e90ff; }
        .btn-mp4-hd:hover { background: #70a1ff; }

        /* Progress Bar */
        .progress-wrapper {
            display: none;
            margin-top: 20px;
        }

        .progress-text {
            font-size: 13px;
            color: #00e5ff;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .progress-container {
            width: 100%;
            height: 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: #00e5ff;
            transition: width 0.4s ease;
        }

        .footer {
            margin-top: 30px;
            font-size: 12px;
            color: #888;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Pro YT Downloader</h1>
        <p>Fast, Ad-Free YouTube Downloader (MP4 & MP3).</p>
        
        <div class="input-group">
            <input type="text" id="videoUrl" placeholder="Paste YouTube Link here...">
            <button class="btn-main" onclick="showDownloadOptions()">Get Download Links</button>
        </div>

        <div class="download-options" id="downloadOptions">
            <h3 style="font-size: 16px; margin-bottom: 15px; color: #fff;">Select Format & Quality:</h3>
            
            <button class="download-btn btn-mp3" onclick="startDownload('audio', 'mp3')">
                🎵 Download MP3 (Audio)
            </button>
            <button class="download-btn btn-mp4" onclick="startDownload('video', '720')">
                🎬 Download MP4 (720p Quality)
            </button>
            <button class="download-btn btn-mp4-hd" onclick="startDownload('video', '1080')">
                🎬 Download MP4 (1080p HD Quality)
            </button>

            <!-- Loading Bar -->
            <div class="progress-wrapper" id="progressWrapper">
                <div class="progress-text" id="progressText">Connecting to server...</div>
                <div class="progress-container">
                    <div class="progress-bar" id="progressBar"></div>
                </div>
            </div>
        </div>

        <div class="footer">
            Powered by Cloudflare Pages & GitHub
        </div>
    </div>

    <script>
        // Extract YouTube ID reliably
        function getVideoId(url) {
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|&v=)([^#&?]*).*/;
            const match = url.match(regExp);
            return (match && match[2].length === 11) ? match[2] : null;
        }

        // Show the buttons after clicking 'Get Download Links'
        function showDownloadOptions() {
            const url = document.getElementById('videoUrl').value.trim();
            const optionsDiv = document.getElementById('downloadOptions');
            const progressWrapper = document.getElementById('progressWrapper');
            
            if (!getVideoId(url)) {
                alert("Please enter a valid YouTube URL!");
                return;
            }

            progressWrapper.style.display = 'none';
            optionsDiv.style.display = 'block';
        }

        // Main Download Function with API & Fallback
        async function startDownload(type, quality) {
            const url = document.getElementById('videoUrl').value.trim();
            const videoId = getVideoId(url);
            
            const progressWrapper = document.getElementById('progressWrapper');
            const progressBar = document.getElementById('progressBar');
            const progressText = document.getElementById('progressText');

            // Show loading bar
            progressWrapper.style.display = 'block';
            progressBar.style.width = '30%';
            progressText.innerText = 'Processing your request...';

            // Cobalt API payload setup
            const payload = {
                url: url
            };

            if (type === 'audio') {
                payload.isAudioOnly = true;
                payload.aFormat = 'mp3';
            } else {
                payload.vQuality = quality; // '720' or '1080'
            }

            try {
                // Fetching direct link from Cobalt public API
                progressBar.style.width = '60%';
                
                const response = await fetch('https://api.cobalt.tools/api/json', {
                    method: 'POST',
                    headers: {
                        'Accept': 'application/json',
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) throw new Error('API Error');

                const data = await response.json();

                if (data && data.url) {
                    progressBar.style.width = '100%';
                    progressText.innerText = 'Download starting...';
                    
                    setTimeout(() => {
                        window.location.href = data.url; // Triggers the actual download
                        setTimeout(() => { progressWrapper.style.display = 'none'; progressBar.style.width = '0%'; }, 2000);
                    }, 1000);
                } else {
                    throw new Error('No URL in response');
                }

            } catch (error) {
                // FALLBACK SYSTEM: If Cobalt API is busy or blocks the request, 
                // it instantly switches to a highly reliable backup downloader (Y2Mate)
                console.log("Primary API busy. Using Fallback System...");
                progressBar.style.width = '90%';
                progressText.innerText = 'Routing to backup server...';

                setTimeout(() => {
                    progressBar.style.width = '100%';
                    progressText.innerText = 'Opening download page...';
                    
                    // Open reliable backup link
                    window.open(`https://www.y2mate.com/youtube/${videoId}`, '_blank');
                    
                    setTimeout(() => { 
                        progressWrapper.style.display = 'none'; 
                        progressBar.style.width = '0%'; 
                    }, 1000);
                }, 1500);
            }
        }
    </script>

</body>
</html>
