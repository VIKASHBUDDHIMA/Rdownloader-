<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro YT Downloader</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 40px;
            border-radius: 20px;
            width: 100%;
            max-width: 550px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.3);
            text-align: center;
            animation: fadeIn 0.8s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1 {
            font-weight: 600;
            margin-bottom: 10px;
            color: #00e5ff;
        }

        p {
            font-weight: 300;
            font-size: 14px;
            margin-bottom: 30px;
            color: #ccc;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        input[type="text"] {
            width: 100%;
            padding: 15px;
            border-radius: 10px;
            border: none;
            outline: none;
            font-size: 15px;
            background: rgba(255,255,255,0.9);
            color: #333;
            transition: 0.3s;
        }

        input[type="text"]:focus {
            box-shadow: 0 0 15px #00e5ff;
        }

        .btn-main {
            padding: 15px;
            background: linear-gradient(135deg, #00e5ff, #0072ff);
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-main:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0, 229, 255, 0.4);
        }

        /* Progress Bar Animation */
        .progress-wrapper {
            display: none;
            margin-top: 25px;
        }

        .progress-text {
            font-size: 13px;
            color: #00e5ff;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .progress-container {
            width: 100%;
            height: 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #00e5ff, #0072ff);
            border-radius: 10px;
            transition: width 0.3s ease;
        }

        /* Result Download Card */
        .result-card {
            display: none;
            margin-top: 30px;
            background: rgba(0, 0, 0, 0.3);
            padding: 20px;
            border-radius: 15px;
            border: 1px solid rgba(255,255,255,0.1);
            animation: fadeIn 0.5s ease-in-out;
            text-align: left;
        }

        .video-preview {
            display: flex;
            gap: 15px;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 15px;
        }

        .video-preview img {
            width: 110px;
            height: 65px;
            border-radius: 8px;
            object-fit: cover;
        }

        .video-info h4 {
            font-size: 13px;
            color: #fff;
            font-weight: 600;
            line-height: 1.3;
        }

        .download-btn {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            padding: 14px 18px;
            margin-bottom: 12px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            color: #fff;
            text-decoration: none;
            transition: 0.2s;
        }

        .btn-mp3 { background: linear-gradient(135deg, #ff416c, #ff4b2b); }
        .btn-mp3:hover { opacity: 0.9; transform: translateY(-1px); }

        .btn-720p { background: linear-gradient(135deg, #11998e, #38ef7d); }
        .btn-720p:hover { opacity: 0.9; transform: translateY(-1px); }

        .btn-1080p { background: linear-gradient(135deg, #2193b0, #6dd5ed); }
        .btn-1080p:hover { opacity: 0.9; transform: translateY(-1px); }

        .tag {
            background: rgba(255, 255, 255, 0.2);
            padding: 3px 8px;
            border-radius: 5px;
            font-size: 11px;
            font-weight: 400;
        }

        .footer {
            margin-top: 30px;
            font-size: 12px;
            color: #888;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Pro YT Downloader</h1>
        <p>Fast, Direct YouTube MP4 & MP3 Downloader.</p>
        
        <div class="input-group">
            <input type="text" id="videoUrl" placeholder="Paste YouTube Link here...">
            <button class="btn-main" onclick="processVideo()">Get Download Links</button>
        </div>

        <!-- Animated Conversion / Loading Bar -->
        <div class="progress-wrapper" id="progressWrapper">
            <div class="progress-text" id="progressText">Analyzing YouTube link...</div>
            <div class="progress-container">
                <div class="progress-bar" id="progressBar"></div>
            </div>
        </div>

        <!-- Direct Download Options -->
        <div class="result-card" id="resultCard">
            <div class="video-preview">
                <img id="thumbImg" src="" alt="Thumbnail">
                <div class="video-info">
                    <h4 id="videoTitle">YouTube Video Ready</h4>
                </div>
            </div>

            <button onclick="triggerDirectDownload('audio')" class="download-btn btn-mp3">
                <span>🎵 Download MP3 Audio</span>
                <span class="tag">High Quality MP3</span>
            </button>

            <button onclick="triggerDirectDownload('720')" class="download-btn btn-720p">
                <span>🎬 Download MP4 Video</span>
                <span class="tag">720p HD</span>
            </button>

            <button onclick="triggerDirectDownload('1080')" class="download-btn btn-1080p">
                <span>🎬 Download MP4 Video</span>
                <span class="tag">1080p Full HD</span>
            </button>
        </div>

        <div class="footer">
            Powered by Cloudflare Pages & GitHub
        </div>
    </div>

    <script>
        let currentVideoId = '';
        let currentVideoUrl = '';

        function getVideoId(url) {
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|&v=)([^#&?]*).*/;
            const match = url.match(regExp);
            return (match && match[2].length === 11) ? match[2] : null;
        }

        function processVideo() {
            const url = document.getElementById('videoUrl').value.trim();
            const videoId = getVideoId(url);

            if (!videoId) {
                alert("Please enter a valid YouTube URL!");
                return;
            }

            currentVideoId = videoId;
            currentVideoUrl = url;

            const progressWrapper = document.getElementById('progressWrapper');
            const progressBar = document.getElementById('progressBar');
            const progressText = document.getElementById('progressText');
            const resultCard = document.getElementById('resultCard');

            resultCard.style.display = 'none';
            progressWrapper.style.display = 'block';
            progressBar.style.width = '0%';
            progressText.innerText = "Analyzing video link...";

            let progress = 0;
            const interval = setInterval(() => {
                progress += 20;
                progressBar.style.width = progress + '%';

                if (progress === 40) {
                    progressText.innerText = "Extracting audio & video streams...";
                } else if (progress === 80) {
                    progressText.innerText = "Preparing direct download options...";
                } else if (progress >= 100) {
                    clearInterval(interval);
                    
                    document.getElementById('thumbImg').src = `https://i.ytimg.com/vi/${videoId}/hqdefault.jpg`;
                    document.getElementById('videoTitle').innerText = "YouTube Video (" + videoId + ")";

                    setTimeout(() => {
                        progressWrapper.style.display = 'none';
                        resultCard.style.display = 'block';
                    }, 300);
                }
            }, 120);
        }

        async function triggerDirectDownload(format) {
            const progressWrapper = document.getElementById('progressWrapper');
            const progressBar = document.getElementById('progressBar');
            const progressText = document.getElementById('progressText');

            progressWrapper.style.display = 'block';
            progressBar.style.width = '30%';
            progressText.innerText = "Connecting to high-speed stream server...";

            const apis = [
                'https://api.cobalt.tools/api/json',
                'https://cobalt-api.kwi.mobi/api/json',
                'https://co.wuk.sh/api/json'
            ];

            let downloadUrl = null;

            for (let api of apis) {
                try {
                    progressBar.style.width = '60%';
                    progressText.innerText = "Converting file for direct download...";

                    const payload = {
                        url: currentVideoUrl,
                        videoQuality: format === 'audio' ? '720' : format,
                        downloadMode: format === 'audio' ? 'audio' : 'auto',
                        audioFormat: 'mp3'
                    };

                    const response = await fetch(api, {
                        method: 'POST',
                        headers: {
                            'Accept': 'application/json',
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(payload)
                    });

                    if (response.ok) {
                        const data = await response.json();
                        if (data.url) {
                            downloadUrl = data.url;
                            break;
                        }
                    }
                } catch (e) {
                    console.log("Trying backup converter...");
                }
            }

            // Fallback direct stream if main engines are busy
            if (!downloadUrl) {
                if (format === 'audio') {
                    downloadUrl = `https://yewtu.be/latest_version?id=${currentVideoId}&itag=140&local=true`;
                } else if (format === '1080') {
                    downloadUrl = `https://yewtu.be/latest_version?id=${currentVideoId}&itag=22&local=true`;
                } else {
                    downloadUrl = `https://yewtu.be/latest_version?id=${currentVideoId}&itag=18&local=true`;
                }
            }

            progressBar.style.width = '100%';
            progressText.innerText = "Download starting...";

            // Direct Browser Download (No redirection, stays on site)
            const a = document.createElement('a');
            a.href = downloadUrl;
            a.download = `YouTube_${currentVideoId}.${format === 'audio' ? 'mp3' : 'mp4'}`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);

            setTimeout(() => {
                progressWrapper.style.display = 'none';
            }, 1000);
        }
    </script>

</body>
</html>
